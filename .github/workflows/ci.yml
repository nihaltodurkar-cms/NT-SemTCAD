# CI for pyTCAD.
#
# The repo had no CI at all: the "N passed, zero warnings" invariant in
# CLAUDE.md was enforced by whoever remembered to run the suite.  This
# makes it automatic.
#
# M43 phase 4 (2026-09-16): the pure-Python fallback for most compiled
# kernels was REMOVED at the user's explicit request (see CLAUDE.md's
# "The C++ engine (M31)" section) -- `pytcad._core` is now REQUIRED for
# the mesh-geometry kernels (P2), the process/adaptivity kernels (P4),
# the M34-S4 nonlocal path tracer, and the M43 thermal-grid assembly.
# The `python-only` job this file used to run (prove the suite passes
# with NO compiler and NO extension -- gate G-F) is RETIRED along with
# that fallback: it can no longer pass, by design, not by regression.
# `import pytcad` itself still never requires the extension (see
# `pytcad/_accel.py`), so there is nothing left for a "no extension"
# job to usefully prove about the bulk of the suite.
#
# `tests` (below) always builds the extension first and is the ONLY
# general-purpose suite job now; `wheel` proves the packaged build.
#
# WINDOWS ONLY (2026-10-01, user decision): the project targets Windows,
# and its bit-identity goldens (e.g. HETERO_FW_DIGESTS) are Windows
# captures, so both jobs run on windows-latest with the SAME toolchain
# layout as the dev machine (CLAUDE.md "The C++ engine (M31)"): MinGW
# g++ from conda-forge in a SEPARATE compiler env (tcad-cpp), never in
# the Python env, with _core statically linking the MinGW runtime. The
# Python env is conda-forge too, with `mkl` so the default MKL PARDISO
# direct solver (loaded at runtime from mkl_rt) is what the suite runs.
# The former Linux `petsc` job is REMOVED: conda-forge publishes no
# win-64 PETSc/petsc4py, so the PETSc gates skip (they are skipif-
# guarded), exactly as on the dev machine without PETSc.
#
# Runs from pytcad/, which is the project root for this repo (see
# CLAUDE.md "Commands").  OPENBLAS_NUM_THREADS=1 is set for the same
# reason CLAUDE.md documents it: without it numpy's BLAS spawns a thread
# pool per xdist worker and oversubscribes the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: full suite (compiled extension required)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}       # -l so conda's env activation is applied
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: tcad
      # Python env: interpreter + mkl (PARDISO's runtime mkl_rt) + eigen
      # (header-only, found via CMAKE_PREFIX_PATH). Compiler env: kept
      # separate on purpose -- see the header comment.
      - name: Install
        working-directory: pytcad
        run: |
          conda install -y -c conda-forge mkl eigen
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nanobind scikit-build-core
          conda create -y -p "$RUNNER_TEMP/tcad-cpp" -c conda-forge gxx binutils cmake ninja
      # The compiler env's Library/bin goes on PATH for THIS step only
      # (cc1plus needs its DLLs); the import check runs in the next step
      # without it, proving _core has no runtime coupling to that env.
      - name: Build the extension in place
        working-directory: pytcad
        run: |
          CPP="$(cygpath -m "$RUNNER_TEMP/tcad-cpp")/Library/bin"
          export PATH="$(cygpath -u "$CPP"):$PATH"
          cmake -S core -B build/dev -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DTCAD_INPLACE_OUTPUT=ON \
                -DCMAKE_CXX_COMPILER="$CPP/g++.exe" \
                -DCMAKE_AR="$CPP/x86_64-w64-mingw32-ar.exe" \
                -DCMAKE_RANLIB="$CPP/x86_64-w64-mingw32-ranlib.exe" \
                -DCMAKE_PREFIX_PATH="$(cygpath -m "$CONDA_PREFIX")/Library" \
                -DPython_EXECUTABLE="$(cygpath -m "$(which python)")"
          cmake --build build/dev
      - name: Import the extension (no compiler env on PATH)
        working-directory: pytcad
        run: python -c "from pytcad import _accel; assert _accel.HAVE_ACCEL; print(_accel.status())"
      - name: Fast suite
        working-directory: pytcad
        run: python -m pytest tests/ gui/tests/ -n 4 -m "not slow and not timing" -q
      # Wall-clock/memory budgets (pytest.ini "timing"): serial, so the
      # parallel workers above do not skew them.
      - name: Timing budgets (serial)
        working-directory: pytcad
        run: python -m pytest tests/ gui/tests/ -m timing -q
      - name: Slow gate battery
        working-directory: pytcad
        run: python -m pytest tests/ gui/tests/ -n 4 -m "slow" -q
      - name: Boundary and parity gates
        working-directory: pytcad
        run: python -m pytest tests/test_accel_boundary.py tests/test_architecture_boundaries.py -q
      # M32. Not a timing gate -- a CI runner's absolute speed is not
      # reproducible enough to assert on, and a threshold that fails on a
      # noisy runner teaches everyone to ignore it. What this proves is
      # that every case still BUILDS AND RUNS and that the dashboard is
      # still produced, which is what stops the suite rotting silently.
      - name: Benchmark suite runs (M32)
        working-directory: pytcad
        run: |
          python -m benchmarks --json benchmark-report.json --out benchmark-report.md
          cat benchmark-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            pytcad/benchmark-report.md
            pytcad/benchmark-report.json

  wheel:
    name: wheel builds
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: tcad
      - name: Install
        run: |
          conda install -y -c conda-forge eigen
          python -m pip install --upgrade pip build
          conda create -y -p "$RUNNER_TEMP/tcad-cpp" -c conda-forge gxx binutils cmake ninja
      # scikit-build-core reads CMAKE_GENERATOR / CMAKE_ARGS; without them
      # it would pick the runner's MSVC, which is not this project's
      # toolchain.
      - name: Build
        working-directory: pytcad
        run: |
          CPP="$(cygpath -m "$RUNNER_TEMP/tcad-cpp")/Library/bin"
          export PATH="$(cygpath -u "$CPP"):$PATH"
          export CMAKE_GENERATOR=Ninja
          export CMAKE_ARGS="-DCMAKE_CXX_COMPILER=$CPP/g++.exe -DCMAKE_AR=$CPP/x86_64-w64-mingw32-ar.exe -DCMAKE_RANLIB=$CPP/x86_64-w64-mingw32-ranlib.exe -DCMAKE_PREFIX_PATH=$(cygpath -m "$CONDA_PREFIX")/Library"
          python -m build --wheel
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pytcad-wheel
          path: pytcad/dist/*.whl
